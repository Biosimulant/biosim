name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    environment:
      name: pypi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build labs serve UI
        run: bash scripts/build_labs_serve_ui.sh

      - name: Build package distributions
        run: python -m build --outdir dist/biosimulant

      - name: Check package distributions
        run: twine check dist/biosimulant/*

      - name: Create release checksum manifest
        run: |
          mkdir -p dist/release
          cd dist/biosimulant
          sha256sum ./* > ../release/SHA256SUMS

      - name: Sign release checksum provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/SHA256SUMS

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: biosimulant-checksums
          path: dist/release/SHA256SUMS

      - name: Publish biosimulant to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/biosimulant
          skip-existing: true
